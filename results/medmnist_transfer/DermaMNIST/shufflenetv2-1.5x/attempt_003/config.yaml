experiment_id: DermaMNIST-shufflenetv2-1.5x
dataset: DermaMNIST
model: shufflenetv2-1.5x
num_classes: 7
input_size:
- 3
- 224
- 224
resize:
  size:
  - 224
  - 224
  interpolation: bilinear
grayscale_to_rgb: false
normalization: none; ToTensor scales uint8 [0,255] to float32 [0,1]
training:
  optimizer: Adam
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 32
  augmentation: none
protocol:
  max_epochs: 50
  selection_metric: validation_macro_f1
  early_stopping_patience: 10
  scheduler:
    name: ReduceLROnPlateau
    monitor: validation_macro_f1
    mode: max
    factor: 0.5
    patience: 4
  seed: 42
  mixed_precision: false
  gradient_accumulation_steps: 1
source_run: null
pretrained: false
